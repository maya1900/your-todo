schema: spec-driven

context: |
  Project: Advanced Todo Web App (your-todo)
  Type: 纯前端单页应用 (SPA)，无后端，数据持久化使用浏览器 LocalStorage

  Tech stack:
    - 构建工具: Vite
    - 框架: React 18 + TypeScript (strict mode)
    - 状态管理: Zustand (含 persist middleware 自动同步 LocalStorage)
    - 样式: Tailwind CSS (utility-first, JIT)
    - 日期处理: date-fns (按需 import，支持 tree-shaking)
    - 存储: LocalStorage (通过 zustand/middleware/persist)
    - 测试: Vitest + React Testing Library
    - 代码风格: ESLint + Prettier，函数式组件 + Hooks，无 class 组件

  Conventions:
    - 文件命名: 组件 PascalCase.tsx，hook camelCase.ts (以 use 开头)，工具函数 camelCase.ts
    - 目录结构: src/{components,store,types,utils,hooks,pages}
    - 类型先行: 所有数据结构先在 src/types 定义
    - 提交规范: Conventional Commits (feat/fix/docs/refactor/test/chore)

  Domain glossary:
    - Todo: 待办事项实体，含 id/title/description/dueDate/priority/category/status/createdAt/updatedAt
    - Priority: low | medium | high | urgent
    - Status: pending | in-progress | completed
    - Category: 用户自定义文本标签 (例如 "工作"/"学习"/"生活")

rules:
  proposal:
    - 用中文撰写
    - 包含明确的"非目标 (Non-goals)"部分，避免范围蔓延
  design:
    - 用中文撰写
    - 必须包含数据模型、组件树、状态管理结构、LocalStorage 数据格式
    - 包含 UI 设计说明（布局、配色、交互流）—— 本项目无独立 ui.md，UI 设计合入 design.md
  tasks:
    - 用中文撰写
    - 按"脚手架 → 类型 → store → 组件 → 集成 → 打磨"的顺序组织
    - 每个任务粒度控制在 1-3 小时内可完成
